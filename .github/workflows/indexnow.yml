name: 'IndexNow - Avisar Buscadores'

on:
  push:
    branches: [ main ] # ou 'master', dependendo do nome da sua branch principal
  workflow_dispatch: # Permite rodar manualmente também

jobs:
  check-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar o deploy do GitHub Pages
        run: sleep 30 # Espera 30 segundos para o site ficar no ar

      - name: Submeter URLs ao IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://www.paulofagoto.com.br/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          # O endpoint padrão é o Bing (www.bing.com), que compartilha com vários buscadores.
